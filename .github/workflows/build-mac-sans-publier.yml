name: Build Mac (sans publier)

# Construit Spectra pour macOS et depose le resultat en piece jointe de
# l'execution, PAS dans une release.
#
# Pourquoi ce second workflow : `build.yml` publie dans une release GitHub, et
# Spectra se met a jour tout seul depuis ces releases. Le declencher
# installerait la nouvelle version sur toutes les machines qui tournent, y
# compris celles qu'on ne veut pas toucher. Ici, rien n'est publie : on
# telecharge le fichier a la main depuis l'onglet Actions.
#
# Lancement : onglet Actions -> "Build Mac (sans publier)" -> "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest

    env:
      # Pas de certificat Apple : electron-builder signe en ad-hoc (`identity: "-"`
      # dans electron-builder.json). Suffisant pour une installation a la main ;
      # sans aucune signature, macOS sur puce Apple refuserait de lancer l'app.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        working-directory: desktop-app
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Verifier les tests
        working-directory: desktop-app
        run: npm test

      - name: Construire l'application
        working-directory: desktop-app
        run: npm run build

      - name: Construire le paquet macOS
        working-directory: desktop-app
        run: npx electron-builder --config electron-builder.json --mac --publish never

      - name: Deposer le resultat
        uses: actions/upload-artifact@v4
        with:
          name: spectra-macos
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop-app/build/*.dmg
            desktop-app/build/*.zip
